  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">

        <div class="card blue-shadow">
          <div class="card-header bg-white py-4 text-center">
            <h2 class="fw-bold mb-1">Contact Us</h2>
            <p class="text-muted">Send us a message and we'll get back to you soon</p>
          </div>

          <div class="card-body p-5">
            <form id="contactForm" novalidate>
              
              <div class="mb-4">
                <label class="form-label fw-medium">Full Name <span class="text-danger">*</span></label>
                <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
                <div id="nameError" class="error-message"></div>
              </div>

              <div class="mb-4">
                <label class="form-label fw-medium">Email Address <span class="text-danger">*</span></label>
                <input type="email" id="email" class="form-control" placeholder="example@email.com" required>
                <div id="emailError" class="error-message"></div>
              </div>

              <div class="mb-4">
                <label class="form-label fw-medium">Subject <span class="text-danger">*</span></label>
                <input type="text" id="subject" class="form-control" placeholder="Message subject" required>
                <div id="subjectError" class="error-message"></div>
              </div>

              <div class="mb-4">
                <label class="form-label fw-medium">Message <span class="text-danger">*</span></label>
                <textarea id="message" class="form-control" rows="6" placeholder="Write your message here..." required></textarea>
                <div id="messageError" class="error-message"></div>
              </div>

              <button type="submit" id="submitBtn" 
                      class="btn btn-primary btn-lg w-100 py-3 fw-bold">
                <i class="fas fa-paper-plane me-2"></i>
                Send Message
              </button>
            </form>
          </div>
        </div>

      </div>
